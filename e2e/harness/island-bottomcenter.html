<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic Island bottom-center morph harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: linear-gradient(160deg, #2a2140 0%, #1a2740 45%, #122033 100%);
      }
      /* #root IS the bottom-center island-root: a fixed box so the capsule anchors
         to its bottom edge and grows upward. Production uses position:fixed inset:0;
         here it is a relative sized box. */
      #root.island-root {
        position: relative;
        inset: auto;
        width: 620px;
        height: 320px;
        margin: 40px;
      }
    </style>
  </head>
  <body>
    <div id="root" class="island-root" data-mode="float" data-position="bottom-center"></div>
    <script type="module" src="./island-bottomcenter.tsx"></script>
  </body>
</html>
