<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic Island shape harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0d1120;
      }
      #root {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 40px;
        padding: 40px;
      }
      .cell {
        position: relative;
      }
      .island {
        position: relative;
      }
      .shape {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./island.ts"></script>
  </body>
</html>
