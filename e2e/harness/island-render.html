<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic Island render harness</title>
    <style>
      html,
      body {
        margin: 0;
        /* macOS-ish wallpaper so the pure-black compact pill and frosted
           expanded surface read against a non-black backdrop. */
        background: linear-gradient(160deg, #2a2140 0%, #1a2740 45%, #122033 100%);
      }
      #root {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 48px;
        padding: 48px;
      }
      .cell {
        position: relative;
        display: flex;
        justify-content: center;
        min-width: 400px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./island-render.tsx"></script>
  </body>
</html>
