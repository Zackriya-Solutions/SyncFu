<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic Island position harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: linear-gradient(160deg, #2a2140 0%, #1a2740 45%, #122033 100%);
      }
      #root {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        padding: 40px;
      }
      /* The production root is position:fixed inset:0; make it a relative sized box
         here so the four positions render side by side. The data-position CSS from
         island.css (justify/align + bottom-anchor) is what we are exercising. */
      .pos-box.island-root {
        position: relative;
        inset: auto;
        width: 620px;
        height: 220px;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./island-position.tsx"></script>
  </body>
</html>
